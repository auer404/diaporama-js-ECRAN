<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaporama JS</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div id="diaporama">

        <img class="diapo visible" src="images/image1.jpg">
        <img class="diapo" src="images/image2.jpg">
        <img class="diapo" src="images/image3.jpg">
        <img class="diapo" src="images/image4.jpg">
        <img class="diapo" src="images/image5.jpg">

    </div>

    <button id="bouton_diapo_precedente">Diapo précédente</button>

    <button id="bouton_diapo_1">1</button>
    <button id="bouton_diapo_2">2</button>
    <button id="bouton_diapo_3">3</button>
    <button id="bouton_diapo_4">4</button>
    <button id="bouton_diapo_5">5</button>

    <button id="bouton_diapo_suivante">Diapo suivante</button>

    <script src="script.js"></script>
    <!-- On place notre script à la fin de la page pour que JS ait bien pu prendre connaissance de tout le contenu avant de vouloir y faire des changements -->
</body>
</html>
